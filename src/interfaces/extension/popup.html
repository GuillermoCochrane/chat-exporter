<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Chat Exporter</title>
  <link rel="stylesheet" href="styles/popup.css">
  <script type="module" src="js/popup.js"></script>
</head>
<body>
  <header>
    <h2>
      <span id="title">Exportando desde </span>
      <strong id="modelName">ChatGPT</strong></h2>
  </header>
  <main>
    <label for="format" id="formatLabel">Formato:</label>
    <select id="format">
      <option value="md">Markdown</option>
      <option value="json">JSON</option>
    </select>
  
    <!-- Opciones exclusivas de Markdown -->
    <div id="mdOptions">
      <fieldset>
        <legend id="optionsLabel">Filtrar mensajes</legend>
          <label>
            <input 
              type="radio" 
              name="role" 
              value="all" 
              checked 
              > 
              <span id="all">Todos</span>
          </label>
        <label>
          <input 
            type="radio" 
            name="role" 
            value="user" 
            >
            <span id="user">Solo usuario</span>
        </label>
        <label>
          <input 
            type="radio" 
            name="role" 
            value="assistant" 
            >
            <span id="assistant">Solo asistente</span>
        </label>
      </fieldset>
      <label>
        <input type="checkbox" id="compact"> 
        <span id="compactLabel">Modo compacto</span>
      </label>
    </div>
    <button id="exportBtn">Exportar</button>
  </main>


  <footer id="status">
    <output class="spinner"></output>
    <strong id="statusText"></strong>
  </footer>

  <aside class="version">v1.2.x</aside>
</body>
</html>
