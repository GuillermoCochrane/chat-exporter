<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Chat Exporter</title>
  <link rel="stylesheet" href="styles/popup.css">
  <script type="module" src="js/popup.js"></script>
</head>
<body>
  <header>
    <h2>
      <span id="title">Exportando desde </span>
      <strong id="modelName">ChatGPT</strong>
    </h2>
    <aside id="langToggle" aria-label="Cambiar idioma" title="Cambiar idioma">
      <!-- Bandera de España (ES) -->
      <svg class="flag active" data-lang="es" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <rect y="4" width="24" height="5" fill="#c60b1e"/>
        <rect y="9" width="24" height="6" fill="#ffc400"/>
        <rect y="15" width="24" height="5" fill="#c60b1e"/>
      </svg>

      <!-- Bandera del Reino Unido (EN) -->
      <svg class="flag" data-lang="en" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 30" width="1000" height="600" hidden>
        <clipPath id="t">
          <path d="M25,15h25v15zv15h-25zh-25v-15zv-15h25z"/>
        </clipPath>
        <path d="M0,0v30h50v-30z" fill="#012169"/>
        <path d="M0,0 50,30M50,0 0,30" stroke="#fff" stroke-width="6"/>
        <path d="M0,0 50,30M50,0 0,30" clip-path="url(#t)" stroke="#C8102E" stroke-width="4"/>
        <path d="M-1 11h22v-12h8v12h22v8h-22v12h-8v-12h-22z" fill="#C8102E" stroke="#FFF" stroke-width="2"/>
      </svg>
    </aside>
  </header>
  <main>
    <label for="format" id="formatLabel">Formato:</label>
    <select id="format">
      <option value="md">Markdown</option>
      <option value="json">JSON</option>
    </select>
  
    <!-- Opciones exclusivas de Markdown -->
    <div id="mdOptions">
      <fieldset>
        <legend id="optionsLabel">Filtrar mensajes</legend>
          <label>
            <input 
              type="radio" 
              name="role" 
              value="all" 
              checked 
              > 
              <span id="all">Todos</span>
          </label>
        <label>
          <input 
            type="radio" 
            name="role" 
            value="user" 
            >
            <span id="user">Solo usuario</span>
        </label>
        <label>
          <input 
            type="radio" 
            name="role" 
            value="assistant" 
            >
            <span id="assistant">Solo asistente</span>
        </label>
      </fieldset>
      <label>
        <input type="checkbox" id="compact"> 
        <span id="compactLabel">Modo compacto</span>
      </label>
    </div>
    <button id="exportBtn">Exportar</button>
  </main>


  <footer id="status">
    <output class="spinner"></output>
    <strong id="statusText"></strong>
  </footer>

  <aside class="version">v1.2.x</aside>
</body>
</html>
