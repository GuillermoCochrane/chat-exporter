<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CWS Screenshot Generator</title>

    <style>
      /* ------------------------------------------------------------------ */
      /* Tokens                                                             */
      /* ------------------------------------------------------------------ */

      :root {
        --rgb-black: 0, 0, 0;
        --rgb-white: 255, 255, 255;
        --rgb-blue: 13, 27, 42;

        --color-bg: #0d1b2a;
        --color-surface: rgba(13, 27, 42, 0.85);

        --color-accent: #25496b;
        --color-accent-hover: #1a3550;

        --color-text: #ebebeb;
        --color-text-dim: #b8c2cc;

        --color-neon: #00d4ff;

        --shadow-dark: rgba(0, 0, 0, 0.65);
        --shadow-darker: rgba(0, 0, 0, 0.85);
      }

      /* ------------------------------------------------------------------ */
      /* Body                                                               */
      /* ------------------------------------------------------------------ */

      body {
        margin: 0;
        padding: 24px;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      /* ------------------------------------------------------------------ */
      /* Canvas                                                             */
      /* ------------------------------------------------------------------ */

      .cws-canvas {
        width: 1280px;
        height: 800px;
        overflow: hidden;
        position: relative;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: var(--color-text);
        font-family:
          Inter,
          system-ui,
          -apple-system,
          sans-serif;
        background:
          radial-gradient(
            circle at 20% 20%,
            var(--color-accent-hover),
            var(--color-bg) 75%
          ),
          linear-gradient(180deg, rgba(255, 255, 255, 0.02), transparent 40%);
      }

      /* ruido muy sutil */

      .cws-canvas::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.025;
        background-image: radial-gradient(circle, white 1px, transparent 1px);
        background-size: 18px 18px;
        pointer-events: none;
      }

      /* ------------------------------------------------------------------ */
      /* Title                                                              */
      /* ------------------------------------------------------------------ */

      .promo-title {
        margin: 0;
        font-size: 60px;
        font-weight: 800;
        letter-spacing: -1px;
        text-align: center;
        text-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
        z-index: 20;
      }

      .promo-title span {
        color: var(--color-neon);
      }

      /* ------------------------------------------------------------------ */
      /* Subtitle                                                           */
      /* ------------------------------------------------------------------ */

      .promo-subtitle {
        margin: 22px 0 54px 0;
        width: 820px;
        text-align: center;
        line-height: 1.55;
        font-size: 26px;
        color: var(--color-text-dim);
        z-index: 20;
      }

      /* ------------------------------------------------------------------ */
      /* Screenshot                                                         */
      /* ------------------------------------------------------------------ */

      .image-wrapper {
        position: relative;
        display: flex;
        max-width: 80%;
        max-height: 62%;
        overflow: hidden;
        border-radius: 18px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.03);
        box-shadow:
          0 32px 70px var(--shadow-darker),
          0 0 0 1px rgba(255, 255, 255, 0.04);
        z-index: 10;
      }

      /* Glow */

      .image-wrapper::before {
        content: "";
        position: absolute;
        inset: -50px;
        background: radial-gradient(
          circle,
          rgba(0, 212, 255, 0.16),
          transparent 72%
        );
        z-index: -1;
      }

      .image-wrapper img {
        display: block;
        width: 100%;
        height: auto;
        object-fit: cover;
      }
    </style>
  </head>

  <body>
    <div class="cws-canvas">
      <h1 class="promo-title">Title Lorem sit amet. <span>Highlight Lorem</span></h1>
      <p class="promo-subtitle">
        Description Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.
      </p>
      <div class="image-wrapper">
        <img src="raw/scr1.png" alt="AI Chat Exporter Screenshot" />
      </div>
    </div>
  </body>
</html>
